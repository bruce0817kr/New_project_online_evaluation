version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: sme_eval_db_prod
    environment:
      POSTGRES_DB: sme_evaluation
      POSTGRES_USER: sme_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - sme_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sme_admin -d sme_evaluation"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Backend API (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: sme_eval_backend_prod
    environment:
      DATABASE_URL: postgresql://sme_admin:${DB_PASSWORD}@postgres:5432/sme_evaluation
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 480
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_SIZE: 52428800
      # OCR Settings
      OCR_LANGUAGE: kor+eng
      OCR_CONFIG: "--psm 6 --oem 3"
      OCR_FALLBACK_STRATEGY: ${OCR_FALLBACK_STRATEGY:-on_low_confidence}
      OCR_CONFIDENCE_THRESHOLD: ${OCR_CONFIDENCE_THRESHOLD:-0.85}
      OCR_ENABLE_ENSEMBLE: ${OCR_ENABLE_ENSEMBLE:-false}
      # Optional AI Vision API Keys
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sme_network
    restart: unless-stopped

  # Frontend (React - Production Build)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: sme_eval_frontend_prod
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL:-https://api.yourdomain.com/api/v1}
      REACT_APP_ENV: production
    depends_on:
      - backend
    networks:
      - sme_network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: sme_eval_nginx_prod
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - backend_uploads:/var/www/uploads:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    networks:
      - sme_network
    restart: unless-stopped

networks:
  sme_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  backend_uploads:
    driver: local
